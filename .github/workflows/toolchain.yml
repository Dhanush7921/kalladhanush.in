name: toolchain-cleanup
on:
  push:
    branches: [toolchain]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete toolchain-tmp --yes --cleanup-tag || true
